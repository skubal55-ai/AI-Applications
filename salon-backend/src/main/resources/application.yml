server:
  port: 8080

spring:
  application:
    name: salon-backend

  datasource:
    url: jdbc:h2:mem:salondb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: c2Fsb24tYXBwLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI0LXZlcnktbG9uZy1zZWNyZXQ=
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  cors:
    allowed-origins: "*"

  subscription:
    plans:
      - name: BASIC
        base-price-usd: 9.99
        features: "Basic booking, View services"
      - name: PREMIUM
        base-price-usd: 19.99
        features: "Priority booking, Discounts, Loyalty points"
      - name: VIP
        base-price-usd: 29.99
        features: "All Premium features, Home service, Free cancellation"
