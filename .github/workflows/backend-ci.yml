name: Backend CI

on:
  push:
    branches: [ main, master, develop, "devin/**", "cursor/**" ]
    paths:
      - 'salon-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'salon-backend/**'

jobs:
  build-and-test:
    name: Build & Test (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: salon-backend
        run: mvn clean compile --no-transfer-progress

      - name: Run unit tests
        working-directory: salon-backend
        run: mvn test --no-transfer-progress

      - name: Package application (skip tests — already run above)
        working-directory: salon-backend
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: salon-backend/target/surefire-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: salon-backend-jar
          path: salon-backend/target/*.jar
          retention-days: 7
