name: GenAI Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  schedule:
    # Run a full scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ai-security-scan:
    name: AI Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai==1.30.1 requests==2.31.0

      - name: Run AI security analysis
        id: security_scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPO_NAME: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          SCAN_MODE: ${{ github.event_name == 'schedule' && 'full' || 'diff' }}
        run: python .github/scripts/genai_security_scan.py

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-report
          path: ai-security-report.md
          retention-days: 90

      - name: Fail on critical findings
        if: steps.security_scan.outputs.critical_count > 0
        run: |
          echo "::error::AI Security Scan found ${{ steps.security_scan.outputs.critical_count }} critical issue(s). Review the security report artifact."
          exit 1
