name: GenAI Test Suggestions

on:
  pull_request:
    types: [ opened, synchronize ]
    paths:
      - 'salon-backend/src/main/**'
      - 'salon-android/app/src/main/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-test-suggestions:
    name: AI Test Gap Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai==1.30.1 requests==2.31.0

      - name: Run AI test suggestion analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/genai_test_suggestions.py

      - name: Upload test suggestions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-suggestions-report
          path: ai-test-suggestions-report.md
          retention-days: 30
