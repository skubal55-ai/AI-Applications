<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <img src="assets/logo.png" alt="Salon Logo" />
      <h1>Salon App</h1>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your account</p>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.invalid]="emailControl?.invalid && emailControl?.touched"
        />
        <div *ngIf="emailControl?.invalid && emailControl?.touched" class="field-error">
          <span *ngIf="emailControl?.errors?.['required']">Email is required</span>
          <span *ngIf="emailControl?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.invalid]="passwordControl?.invalid && passwordControl?.touched"
          />
          <button type="button" class="toggle-password" (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="field-error">
          <span *ngIf="passwordControl?.errors?.['required']">Password is required</span>
          <span *ngIf="passwordControl?.errors?.['minlength']">Minimum 6 characters</span>
        </div>
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
